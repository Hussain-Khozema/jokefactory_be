# golangci-lint configuration (v2 schema)
# Run: make lint

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # Core correctness linters
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Additional linters for code quality
    - bodyclose      # Check HTTP response body is closed
    - contextcheck   # Check context.Context usage
    - dupl           # Detect duplicate code
    - errname        # Check error naming conventions
    - errorlint      # Find issues with error wrapping
    - exhaustive     # Check exhaustiveness of enum switches
    - gocognit       # Check cognitive complexity
    - goconst        # Find repeated strings that could be constants
    - gocritic       # Comprehensive Go linter
    - gocyclo        # Check cyclomatic complexity
    - gosec          # Security checker
    - misspell       # Find misspelled words
    - nakedret       # Find naked returns
    - nilerr         # Find nil error returns
    - nilnil         # Check for nil,nil returns
    - noctx          # Find HTTP requests without context
    - prealloc       # Find slice preallocation opportunities
    - predeclared    # Find shadowed predeclared identifiers
    - revive         # Fast, configurable linter
    - unconvert      # Remove unnecessary type conversions
    - unparam        # Find unused function parameters
    - whitespace     # Check whitespace issues

  settings:
    gocyclo:
      min-complexity: 15
    gocognit:
      min-complexity: 20
    goconst:
      min-len: 3
      min-occurrences: 3
      ignore-tests: true
      # Category labels like "Long" appear in multiple dimensions with different
      # meanings; don't force them onto LengthLong / similar constants.
      match-constant: false
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
        - name: unreachable-code
        - name: redefines-builtin-id
        # "exported" deliberately omitted — forces noisy per-symbol godoc.
    gosec:
      excludes:
        - G104 # Audit errors not checked (too noisy)

  exclusions:
    rules:
      # Relax noisy linters on test files
      - path: _test\.go
        linters:
          - dupl
          - gosec
          - gocognit
          - gocyclo
          - goconst
          - nilnil
          - gocritic
      # Known false positive
      - linters:
          - gocritic
        text: "unnecessaryDefer"
      # Specs is intentionally a table of category string literals (single source
      # of truth). Shared labels like "Moderate" appear across dimensions with
      # different meanings — extracting constants would obscure the config.
      - path: src/core/domain/scoring/dimensions\.go
        linters:
          - goconst
      # Pre-existing goconst debt (duplicated JSON response-key strings) in the
      # legacy handlers. These files are rewritten/deleted in Phases 3/4/10, so
      # we grandfather the debt rather than churn doomed code. Remove this rule
      # once these files are gone.
      - path: src/app/http/handler/
        linters:
          - goconst
      # Adapter methods implement ports; per-method godoc adds noise without value.
      - path: src/infra/repo/postgres/.+\.go
        linters:
          - revive
          - nilnil
          - goconst

formatters:
  enable:
    - gofmt      # Check code formatting
    - goimports  # Check import formatting
