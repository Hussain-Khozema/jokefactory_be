name: verify

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so golangci-lint can diff against origin/main's
          # merge-base and only report newly introduced lint issues.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Verify (fmt-check, lint, test)
        run: make verify
        env:
          # On PRs, grandfather pre-existing issues by diffing against the
          # base branch; only new/changed code fails the lint gate.
          LINT_BASE_REF: origin/main
